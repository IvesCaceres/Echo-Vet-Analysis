name: Public reproducibility checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      ECHO_MODE: PUBLIC_DEMO
      ECHO_RESULTS_KIND: SYNTHETIC_DEMO
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install public runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Keep plotting configuration outside the exported source
        run: echo "MPLCONFIGDIR=$RUNNER_TEMP/echo-matplotlib" >> "$GITHUB_ENV"
      - name: Initialize plotting cache before restricted notebook execution
        run: python -B -c "import matplotlib.pyplot; import matplotlib.font_manager as fm; fm.findfont('DejaVu Sans')"
      - name: Export source without Git objects
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/echo-public.zip"
          python -B -m zipfile -e "$RUNNER_TEMP/echo-public.zip" "$RUNNER_TEMP/echo-public"
      - name: Run public tests and publication checks
        working-directory: ${{ runner.temp }}/echo-public
        run: |
          python -B -m unittest discover -s tests -v
          python -B scripts/validate_candidate.py
      - name: Run synthetic notebooks only
        working-directory: ${{ runner.temp }}/echo-public
        run: |
          python -B scripts/run_notebook.py notebooks/00_gold_v2_inventory.ipynb
          python -B scripts/run_notebook.py notebooks/01_data_quality.ipynb
          python -B scripts/run_notebook.py notebooks/02_population_demographics.ipynb
          python -B scripts/run_notebook.py notebooks/03_event_consistency_audit.ipynb
          python -B scripts/run_notebook.py notebooks/10_reviewed_aggregate_results.ipynb
